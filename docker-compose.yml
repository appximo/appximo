# Appximo — local / dev quickstart (laptop, Docker Desktop on Win/Mac/Linux).
#
#   cp .env.example .env   # then edit the secrets
#   docker compose up -d   # pulls the published image + postgres, ~20s
#
# Uses the pre-built multi-arch image from Docker Hub — no Go toolchain, no
# compile. To build from source instead: docker build -t neodevtrix/appximo:latest .
# For PRODUCTION (a VPS with a domain, automatic TLS, tenant subdomains) use
# docker-compose.prod.yml — see docs/DEPLOY.md.
#
# The visual UI is published from the separate `appximo-ui` repository and is
# therefore behind the optional "ui" profile (its image is not on a public
# registry yet). Enable it with:  docker compose --profile ui up
#
# First-run note: the database starts empty. The engine serves the baked example
# schema, and /healthz is live immediately, but tenant tables are created when you
# register a tenant through the control plane on :9090 (see README → Deployment).

services:
  engine:
    image: neodevtrix/appximo:latest
    environment:
      DATABASE_URL: postgres://appximo:${DB_PASSWORD:-changeme}@db:5432/appximo?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY is required}
      GOMAXPROCS: "2"
      # Content-addressable file store (FILES-V1). Shared with the worker via the
      # files_data volume so the worker's VFS.Get sees what the engine's VFS.Put wrote.
      APPXIMO_FILES_DIR: /var/lib/appximo/files
      # Observability store (trace + snapshot history). Pointed at the obs_data
      # volume below so the history SURVIVES a container restart (the default
      # /var/lib/appximo/obs.db would otherwise sit in the ephemeral layer).
      OBS_DB_PATH: /var/lib/appximo/obs/obs.db
    ports:
      - "8080:8080" # data plane: REST + GraphQL (public)
      - "9090:9090" # control plane: tenant/schema admin (keep private in prod)
    volumes:
      - files_data:/var/lib/appximo/files
      - obs_data:/var/lib/appximo/obs # observability history survives restarts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Class-2 outbox consumer (ADR-016) — a SEPARATE process from the engine, SAME
  # image (run via the `worker` entrypoint keyword). It drains public.outbox with
  # SELECT … FOR UPDATE SKIP LOCKED, so you can scale it horizontally (set
  # `deploy.replicas` or `docker compose up --scale worker=N`) and the N workers
  # claim disjoint rows — never double-processing (proven in WORKER-V1).
  worker:
    image: neodevtrix/appximo:latest
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://appximo:${DB_PASSWORD:-changeme}@db:5432/appximo?sslmode=disable
      # MUST equal the engine's JWT_SECRET — the worker mints a short-lived,
      # scoped service JWT to write results back through the engine API.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      # echo (default, logs+acks) | writeback (demo PATCH) | xlsx (FileJob consumer).
      APPXIMO_WORKER_MODE: ${APPXIMO_WORKER_MODE:-echo}
      APPXIMO_ENGINE_URL: http://engine:8080
      # Internal Host-header suffix for the engine API call ({tenant}.{suffix});
      # the engine reads the tenant from the SUBDOMAIN, so "localhost" is correct
      # even in prod — it is NOT a DNS name (see DEPLOY.md).
      APPXIMO_TENANT_DOMAIN: ${APPXIMO_TENANT_DOMAIN:-localhost}
      APPXIMO_WORKER_ROLE: ${APPXIMO_WORKER_ROLE:-service_worker}
      # Same CAS root as the engine (xlsx mode resolves file_ref via VFS.Get).
      APPXIMO_FILES_DIR: /var/lib/appximo/files
    volumes:
      - files_data:/var/lib/appximo/files
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started
    restart: unless-stopped

  ui:
    image: appximo/ui:latest
    # opt-in: `docker compose --profile ui up`. The UI image is NOT on a public
    # registry yet — build it from the appximo-ui repo (or point this at your own
    # image) before enabling the profile.
    profiles: ["ui"]
    environment:
      NEXT_PUBLIC_API_URL: http://engine:9090
      # Dev default so a plain `docker compose up` never fails on this profiled
      # service (compose interpolates the whole file before applying profiles, so
      # a required `:?` here would break the default up). SET A STRONG VALUE before
      # running the UI in anything but local dev.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme}
      NEXTAUTH_URL: http://localhost:3100
    ports:
      - "3100:3100"
    depends_on:
      - engine
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appximo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: appximo
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      # Control-plane DDL applied automatically on the FIRST init of the pgdata
      # volume (postgres runs /docker-entrypoint-initdb.d/*.sql once). Without
      # it, registering a tenant on :9090 fails — fresh databases have no
      # public.tenants. Pre-existing volumes: apply it manually once with
      #   docker compose exec -T db psql -U appximo -d appximo < migrations/001_control_plane.sql
      - source: control_plane_init
        target: /docker-entrypoint-initdb.d/001_control_plane.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appximo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  files_data: # content-addressable file store, shared by engine + worker
  obs_data: # observability SQLite store (OBS_DB_PATH), engine only — survives restart

configs:
  # Inline copy of migrations/001_control_plane.sql so the quickstart needs only
  # this file + .env (no clone). Keep both in sync if the control plane changes
  # (it is additive/idempotent: CREATE IF NOT EXISTS).
  control_plane_init:
    content: |
      CREATE TABLE IF NOT EXISTS public.tenants (
          id           TEXT        PRIMARY KEY,
          pg_schema    TEXT        NOT NULL UNIQUE,
          display_name TEXT        NOT NULL,
          email        TEXT        NOT NULL,
          plan         TEXT        NOT NULL DEFAULT 'free',
          json_schema  JSONB,
          created_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
          updated_at   TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      CREATE TABLE IF NOT EXISTS public.tenant_policies (
          tenant_id  TEXT        PRIMARY KEY REFERENCES public.tenants(id) ON DELETE CASCADE,
          policy     JSONB       NOT NULL,
          updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      CREATE TABLE IF NOT EXISTS public.migration_log (
          id          BIGSERIAL   PRIMARY KEY,
          tenant_id   TEXT        NOT NULL REFERENCES public.tenants(id) ON DELETE CASCADE,
          status      TEXT        NOT NULL CHECK (status IN ('pending', 'running', 'ok', 'failed')),
          changes     TEXT,
          error       TEXT,
          started_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
          finished_at TIMESTAMPTZ
      );

      CREATE OR REPLACE FUNCTION public.notify_schema_updated()
      RETURNS TRIGGER LANGUAGE plpgsql AS $$$$
      BEGIN
          PERFORM pg_notify('schema_updated', NEW.id);
          RETURN NEW;
      END;
      $$$$;

      DROP TRIGGER IF EXISTS schema_updated_trigger ON public.tenants;

      CREATE TRIGGER schema_updated_trigger
          AFTER UPDATE OF json_schema ON public.tenants
          FOR EACH ROW
          EXECUTE FUNCTION public.notify_schema_updated();
