<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appitools — Trace Explorer</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--muted:#8b93a7;}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg)}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  input,select,button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
  button{cursor:pointer}
  button:hover{border-color:#3a86ff}
  label{color:var(--muted);display:flex;gap:6px;align-items:center}
  .spacer{flex:1}
  #status{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tr.trace{cursor:pointer}
  tr.trace:hover{background:#1c2029}
  .tid{color:#9ad0ff}
  .when{color:var(--muted);font-size:11px;white-space:nowrap}
  .total{text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-weight:600;font-size:11px}
  .st-2{background:#0f3d24;color:#7fe0a3}      /* 2xx green */
  .st-3{background:#10353d;color:#7fd3e0}      /* 3xx teal  */
  .st-4{background:#4a3c0e;color:#ffd66b}      /* 4xx yellow*/
  .st-5{background:#4d1717;color:#ff8a8a}      /* 5xx red   */
  .bar{display:flex;height:16px;width:100%;border-radius:4px;overflow:hidden;background:#0a0c10;border:1px solid var(--line)}
  .seg{height:100%;min-width:1px}
  .seg.hot{outline:2px solid #ff3b3b;outline-offset:-2px}
  .detail{background:#10131a}
  .detail td{padding:0}
  .spanrow{display:flex;align-items:center;gap:10px;padding:4px 10px;border-bottom:1px solid #1b1f29}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none}
  .sname{width:120px}.sus{width:110px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .spct{width:60px;text-align:right;color:var(--muted)}
  .sbar{flex:1;height:8px;background:#0a0c10;border-radius:3px;overflow:hidden}
  .sbar > div{height:100%}
  .esec{border-top:1px solid #1b1f29;padding:8px 12px}
  .esec:first-child{border-top:none}
  .ehdr{color:var(--muted);font-size:10px;letter-spacing:1px;margin-bottom:6px}
  .ebody{font-size:12px}
  .ebody.err{color:#ff8a8a;white-space:pre-wrap;word-break:break-word}
  .frame{display:flex;gap:10px;padding:2px 0;align-items:baseline}
  .floc{color:#9ad0ff;min-width:330px}
  .ffn{color:var(--muted)}
  .curlbox{position:relative;background:#0a0c10;border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:4px}
  .curl{margin:0;white-space:pre-wrap;word-break:break-all;color:#cdd3df;font-size:12px;line-height:1.5}
  .copybtn{position:absolute;top:8px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--fg);padding:3px 10px;font:inherit;font-size:11px;cursor:pointer}
  .copybtn:hover{border-color:#3a86ff}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:8px 18px;border-bottom:1px solid var(--line)}
  .legend span{display:flex;gap:5px;align-items:center}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>⛓ Trace Explorer</h1>
  <label>tenant <input id="tenant" size="8" placeholder="acme"></label>
  <label>admin key <input id="key" size="14" type="password" placeholder="X-Admin-Key"></label>
  <label>source
    <select id="mode">
      <option value="recent">recent (ring)</option>
      <option value="slow">slow (SQLite, 24h)</option>
    </select>
  </label>
  <button id="load">Load</button>
  <label><input type="checkbox" id="auto"> auto 5s</label>
  <span class="spacer"></span>
  <span id="status">idle</span>
</header>
<div class="legend" id="legend"></div>
<table>
  <thead><tr><th style="width:150px">trace_id</th><th style="width:160px">when</th><th>route</th><th style="width:70px">status</th><th class="total" style="width:90px">total</th><th style="width:40%">breakdown</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" class="empty">Enter tenant + admin key and press Load.</div>

<script>
const COLORS = {
  jwt:"#3a86ff", rbac:"#5fd28a", cache_hit:"#8a93a7", cache_miss:"#6b7280",
  cache:"#8a93a7", query:"#ff6b6b", serialize:"#ffa94d", gzip:"#b197fc",
  hook:"#22d3ee", insert:"#c08457", done:"#3a4150"
};
const color = n => COLORS[n] || "#64748b";
const $ = id => document.getElementById(id);
let timer = null;

function statusText(s){ return s>=500?"st-5":s>=400?"st-4":s>=300?"st-3":"st-2"; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shortFn(fn){ if(!fn) return ""; const i=fn.lastIndexOf("/"); return i>=0?fn.slice(i+1):fn; }
// ts is unix MICROseconds (Sample.Start / slow_traces.ts) → /1000 = ms for Date.
function fmtTime(ts){ if(!ts) return "-"; const d=new Date(ts/1000); try{ return d.toLocaleString('es-CO',{dateStyle:'short',timeStyle:'medium'}); }catch(e){ return d.toLocaleString(); } }
function codeToFlag(cc){ if(!cc||cc.length!==2) return ""; return cc.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0))); }
// Rebuild a runnable curl from the captured method + filtered headers + URL (+ body if present).
function buildCurl(t){
  const m = t.method || 'GET';
  let cmd = 'curl \\\n  -X '+m+' \\\n';
  const h = t.headers || {};
  for(const k of Object.keys(h).sort()){
    const safe = String(h[k]).replace(/'/g, "'\\''"); // shell-escape single quotes
    cmd += "  -H '"+k+": "+safe+"' \\\n";
  }
  if(t.body_snip && ['POST','PUT','PATCH'].includes(m)){
    const sb = String(t.body_snip).replace(/'/g, "'\\''");
    cmd += "  -d '"+sb+"' \\\n";
  }
  cmd += "  '"+(t.full_url||'')+"'";
  return cmd;
}

function renderLegend(){
  $("legend").innerHTML = Object.keys(COLORS).filter(k=>k!=="cache")
    .map(k=>`<span><i class="swatch" style="background:${COLORS[k]}"></i>${k}</span>`).join("");
}

function render(traces){
  const rows = $("rows"); rows.innerHTML = "";
  if(!traces || !traces.length){ $("empty").style.display="block"; $("empty").textContent="No traces yet."; return; }
  $("empty").style.display="none";
  traces.forEach((t,i)=>{
    const total = t.total_us || (t.spans||[]).reduce((a,s)=>a+s.dur_us,0) || 1;
    const tr = document.createElement("tr"); tr.className="trace";
    const bar = (t.spans||[]).map(s=>{
      const pct=(s.dur_us/total*100);
      const hot = pct>80 ? " hot":"";
      return `<div class="seg${hot}" style="width:${pct}%;background:${color(s.name)}" title="${s.name}: ${s.dur_us}µs (${pct.toFixed(1)}%)"></div>`;
    }).join("");
    tr.innerHTML =
      `<td class="tid">${t.trace_id||"-"}</td>`+
      `<td class="when">${fmtTime(t.ts)}</td>`+
      `<td>${esc(t.route||"-")}</td>`+
      `<td><span class="badge ${statusText(t.status)}">${t.status||"·"}</span></td>`+
      `<td class="total">${(total/1000).toFixed(2)} ms</td>`+
      `<td><div class="bar">${bar}</div></td>`;
    const detail = document.createElement("tr"); detail.className="detail"; detail.style.display="none";
    const cell = document.createElement("td"); cell.colSpan=6;

    const spansHTML = (t.spans||[]).map(s=>{
      const pct=(s.dur_us/total*100);
      return `<div class="spanrow">`+
        `<i class="swatch" style="background:${color(s.name)}"></i>`+
        `<span class="sname">${esc(s.name)}</span>`+
        `<span class="sus">${s.dur_us} µs</span>`+
        `<span class="spct" ${pct>80?'style="color:#ff6b6b"':''}>${pct.toFixed(1)}%</span>`+
        `<div class="sbar"><div style="width:${pct}%;background:${color(s.name)}"></div></div>`+
        `</div>`;
    }).join("") || '<div class="spanrow">no spans</div>';

    // REQUEST
    const reqBits = ['tenant: '+esc($("tenant").value.trim()), esc(((t.method||'')+' '+(t.route||'-')).trim())];
    if(t.role)    reqBits.push('role: '+esc(t.role));
    if(t.user_id) reqBits.push('user: '+esc(t.user_id));
    let html = `<div class="esec"><div class="ehdr">REQUEST</div><div class="ebody">${reqBits.join('  ·  ')}</div></div>`;
    // CLIENT (IP / browser / OS / country) — shown when any field is present
    if(t.ip || t.browser || t.os || t.country){
      const cl = [];
      if(t.ip)      cl.push('IP: '+esc(t.ip));
      if(t.browser) cl.push('Browser: '+esc(t.browser));
      if(t.os)      cl.push('OS: '+esc(t.os));
      if(t.country) cl.push('Country: '+codeToFlag(t.country)+' '+esc(t.country));
      html += `<div class="esec"><div class="ehdr">CLIENT</div><div class="ebody">${cl.join('  ·  ')}</div></div>`;
    }
    // HTTP REQUEST — reproducible curl (shown when we captured the full URL)
    if(t.full_url){
      html += `<div class="esec"><div class="ehdr">HTTP REQUEST</div>`+
        `<div class="curlbox"><button class="copybtn">Copy</button><pre class="curl">${esc(buildCurl(t))}</pre></div></div>`;
    }
    // ERROR (any 4xx/5xx with a message)
    if(t.error_msg){
      html += `<div class="esec"><div class="ehdr">ERROR</div><div class="ebody err">${esc(t.error_msg)}</div></div>`;
    }
    // STACK TRACE (500s only — present when t.stack is non-empty)
    if(t.stack && t.stack.length){
      const frames = t.stack.map(f=>
        `<div class="frame"><span class="floc">${esc(f.file)}:${f.line}</span><span class="ffn">→ ${esc(shortFn(f.function))}()</span></div>`
      ).join("");
      html += `<div class="esec"><div class="ehdr">STACK TRACE</div><div class="ebody">${frames}</div></div>`;
    }
    // SPANS
    html += `<div class="esec"><div class="ehdr">SPANS</div><div class="ebody">${spansHTML}</div></div>`;
    cell.innerHTML = html;
    const cb = cell.querySelector('.copybtn');
    if(cb){
      cb.onclick = (ev)=>{
        ev.stopPropagation();
        const pre = cell.querySelector('.curl');
        navigator.clipboard.writeText(pre.textContent).then(()=>{
          cb.textContent = '✓ Copied!';
          setTimeout(()=>{ cb.textContent = 'Copy'; }, 2000);
        }).catch(()=>{ cb.textContent = 'copy failed'; });
      };
    }
    detail.appendChild(cell);
    tr.onclick = ()=>{ detail.style.display = detail.style.display==="none"?"":"none"; };
    rows.appendChild(tr); rows.appendChild(detail);
  });
}

async function load(){
  const tenant=$("tenant").value.trim(), key=$("key").value, mode=$("mode").value;
  if(!tenant){ $("status").textContent="enter a tenant"; return; }
  localStorage.setItem("appitools_admin_key", key);
  localStorage.setItem("appitools_tenant", tenant);
  const url = `/debug/tenant/${encodeURIComponent(tenant)}`+(mode==="slow"?"?traces=slow":"");
  $("status").textContent="loading…";
  try{
    const res = await fetch(url,{headers:{"X-Admin-Key":key}});
    if(res.status===401){ $("status").textContent="401 — wrong admin key"; return; }
    if(!res.ok){ $("status").textContent="HTTP "+res.status; return; }
    const data = await res.json();
    const traces = mode==="slow" ? data.slow_traces : data.recent_traces;
    render(traces);
    $("status").textContent = `${(traces||[]).length} ${mode} trace(s) · ${new Date().toLocaleTimeString()}`;
  }catch(e){ $("status").textContent="error: "+e.message; }
}

function setAuto(){
  if(timer){clearInterval(timer);timer=null;}
  if($("auto").checked){ timer=setInterval(load,5000); }
}

renderLegend();
// Read the admin key from the URL (?key=...) so the page opens directly in a
// browser; fall back to the last value used. It feeds every internal fetch.
const urlKey = new URLSearchParams(location.search).get("key") || "";
$("key").value = urlKey || localStorage.getItem("appitools_admin_key") || "";
$("tenant").value = new URLSearchParams(location.search).get("tenant")||localStorage.getItem("appitools_tenant")||"";
$("load").onclick = load;
$("mode").onchange = load;
$("auto").onchange = setAuto;
[ "tenant","key" ].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")load();}));
if($("key").value) load();
</script>
</body>
</html>
