name: Security Scan (Nightly)

# OWASP ZAP API scan driven by the engine's OWN generated OpenAPI 3.0 spec
# (`appitools openapi`). Runs nightly and on demand.
#
# SAFETY (deliberate, see context-docs/TESTING_PLAN.md "Hallazgos S39"):
# an API scan is ACTIVE — it sends attack payloads (the brief's `-a`). It must
# therefore target a THROWAWAY / STAGING instance, NEVER production. This workflow
# refuses to scan the prod IP and requires an explicit target, so the nightly cron
# can never silently attack prod. Set the target via the `ZAP_TARGET_URL` repo
# variable (Settings → Variables) or the manual-run input. Until a staging target
# exists, the nightly run fails fast with a clear message — that is intended: no
# target, no scan. ZAP itself is heavy (RAM), so it stays nightly/manual, never per-PR.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      target:
        description: 'Base URL to scan — a STAGING/throwaway instance, NEVER prod'
        required: true
        default: ''

permissions:
  contents: read
  issues: write # action-api-scan files an issue summarising alerts

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve + guard the scan target
        id: target
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then TARGET="${{ vars.ZAP_TARGET_URL }}"; fi
          if [ -z "$TARGET" ]; then
            echo "::error::No scan target. Set the ZAP_TARGET_URL repo variable or pass a workflow_dispatch input (a STAGING/throwaway instance — never prod)."
            exit 1
          fi
          case "$TARGET" in
            *PROD-VPS*)
              echo "::error::Refusing to active-scan production (PROD-VPS). Point this at a throwaway/staging instance."
              exit 1
              ;;
          esac
          echo "url=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Generate OpenAPI spec (base-url = scan target)
        run: |
          set -euo pipefail
          go run ./cmd/appitools openapi \
            --base-url "${{ steps.target.outputs.url }}" \
            tests/fixtures/schemas/logistics_schema.json > openapi.yml
          head -n 10 openapi.yml

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: openapi.yml
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a' # active scan — safe ONLY because the target is guarded to non-prod
