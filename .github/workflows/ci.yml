name: CI

on:
  push:
    branches: [main]
    # Version tags run the full suite too: docker-publish.yml triggers off this
    # workflow's completion (workflow_run), so a tag only publishes if its CI
    # run — same SHA — is green.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Testcontainers' Ryuk reaper intermittently fails to start on cold/ephemeral
# runners ("reaper ... invalid port"), flaking the db/security/integration suites.
# CI runners are ephemeral, so the reaper's cleanup is unnecessary — disable it.
env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  test:
    name: Test & fix gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Formatting gate FIRST — fails in seconds, listing every offending file
      # (RELEASE-AUDIT-V1 finding: the tree had drifted because nothing gated it).
      # Same command devs run locally: make fmt-check.
      - name: gofmt gate
        run: make fmt-check

      - name: Build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # Readable, grouped test output in CI logs. gotestfmt consumes `go test -json`.
      - name: Install gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

      # ---------------------------------------------------------------------
      # Fix gates — each fails CI if its security/resilience fix regresses.
      # The db, security and integration suites use testcontainers, which needs
      # the Docker daemon that GitHub-hosted ubuntu runners provide by default.
      # ---------------------------------------------------------------------
      - name: 'Gate · RBAC cache isolation (FIX 1 — no cross-role cache leak)'
        run: go test ./pkg/cache/... -race -count=1

      - name: 'Gate · rate limiter + circuit breaker (FIX 2/3)'
        run: go test ./pkg/resilience/... -race -count=1

      - name: 'Gate · DB query timeout + circuit breaker (FIX 2)'
        run: go test ./pkg/db/... -race -count=1

      - name: 'Gate · tenant isolation (security)'
        run: go test ./pkg/security/... -race -count=1

      - name: 'Gate · wiring smoke — fixes mounted in the router'
        run: go test -run TestWiring ./... -count=1

      # Full suite, formatted with gotestfmt. pipefail keeps a test failure fatal
      # even though the output is piped (the pipe's exit status would otherwise be
      # gotestfmt's). Raw JSON is archived so a failure is still inspectable.
      - name: Full test suite (race, formatted)
        run: |
          set -euo pipefail
          go test ./... -race -count=1 -json 2>&1 | tee gotest.json | gotestfmt

      - name: Upload raw test JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gotest-json
          path: gotest.json
          if-no-files-found: ignore

      # S37 integration suite is behind the `integration` build tag (real Postgres
      # via testcontainers) so it stays out of the unit lane. Run it explicitly.
      - name: 'Integration · observability metrics (tags integration)'
        run: go test -tags integration -race -count=1 ./tests/integration/...

  # ---------------------------------------------------------------------
  # OPS-25 (CTX-CLOSE-S1): Windows, verifiable FOREVER instead of reasoned
  # about once. Runs in parallel with the Linux jobs, so it adds no wall time
  # beyond its own duration; it is a REAL gate — a failure turns CI red.
  #
  # What it covers:
  #   - the whole module compiles and the platform-sensitive unit lanes pass
  #     natively on Windows (paths, %LOCALAPPDATA%, the .env BOM case);
  #   - `validate --json` keeps stdout machine-clean on Windows;
  #   - the four `upgrade` scenarios from the backlog, against the REAL
  #     pinned release (download, checksum, the rename-aside dance):
  #       1. idle upgrade  2. upgrade while `serve` is RUNNING (real
  #       PostgreSQL, the runner image ships one)  3. a locked .old.exe
  #       (the natural aftermath of 2)  4. an unwritable destination;
  #   - the released .exe actually BOOTS (scenario 2 serves with it).
  #
  # NOT covered, deliberately (recorded in docs/BACKLOG.md, OPS-25): a real
  # Program Files ACL (the runner user is an administrator; scenario 4
  # simulates the class with an explicit deny ACL), antivirus file locks, and
  # a non-admin user profile.
  #
  # UPGRADE_TAG is pinned so the job is deterministic; bump it deliberately
  # when a release changes the upgrade contract.
  windows:
    name: Windows gate (OPS-25)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UPGRADE_TAG: v0.1.5
    defaults:
      run:
        shell: pwsh
    steps:
      # The Windows runner image sets core.autocrlf=true system-wide, which
      # rewrites every LF file to CRLF at checkout — breaking any test that
      # compares file bytes against an embedded doc or golden string. Neutralize
      # BEFORE checkout so the tree is byte-identical to the Linux jobs'.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (whole module, native Windows)
        run: go build ./...

      - name: Unit lane (platform-sensitive packages)
        run: |
          go test -short -count=1 ./cmd/appximo/... ./pkg/platformpath/... ./pkg/schema/... ./pkg/query/... 2>&1 | Tee-Object -FilePath win-gotest.txt
          if ($LASTEXITCODE -ne 0) { throw "unit lane failed" }

      # Logs of a failed run are not API-readable without a token (the box that
      # watches CI has none); the artifact is the black box, same pattern as the
      # Linux gotest-json.
      - name: Upload Windows test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-gotest
          path: win-gotest.txt
          if-no-files-found: ignore

      - name: '.env loading incl. the UTF-8 BOM case (F1-bis)'
        run: |
          go test -short -count=1 -run TestLoadDotEnv .
          if ($LASTEXITCODE -ne 0) { throw "dotenv lane failed" }

      - name: Build the CLI and prepare the e2e dir
        run: |
          go build -o appximo.exe ./cmd/appximo
          .\appximo.exe version --json
          New-Item -ItemType Directory -Force win-e2e | Out-Null
          Copy-Item appximo.exe win-e2e\appximo.exe

      - name: 'validate --json: stdout is exactly one JSON object'
        run: |
          $out = .\appximo.exe validate examples/quickstart/schema.json --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "validate --json exited $LASTEXITCODE" }
          $parsed = $out | ConvertFrom-Json   # throws if stdout is not clean JSON
          if (-not $parsed.valid) { throw "quickstart schema reported invalid: $out" }

      - name: 'upgrade scenario 0: --check with a pinned tag is a no-write no-op'
        working-directory: win-e2e
        run: |
          $before = (Get-FileHash appximo.exe).Hash
          .\appximo.exe upgrade --check --version $env:UPGRADE_TAG
          if ($LASTEXITCODE -ne 0) { throw "upgrade --check exited $LASTEXITCODE" }
          if ((Get-FileHash appximo.exe).Hash -ne $before) { throw "--check modified the binary" }

      - name: 'upgrade scenario 1 (idle): real download, checksum, rename-aside swap'
        working-directory: win-e2e
        run: |
          .\appximo.exe upgrade --version $env:UPGRADE_TAG
          if ($LASTEXITCODE -ne 0) { throw "idle upgrade exited $LASTEXITCODE" }
          $v = .\appximo.exe version --json | ConvertFrom-Json
          $want = $env:UPGRADE_TAG
          if ($v.version -ne $want) { throw "version after upgrade: $($v.version), want $want" }
          if (-not (Test-Path appximo.exe.old.exe)) { throw "rename-aside did not leave appximo.exe.old.exe" }

      - name: Start PostgreSQL (preinstalled on the runner image)
        run: |
          $svc = Get-Service postgresql* | Select-Object -First 1
          if (-not $svc) { throw "no postgresql service on this runner image" }
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\createdb.exe" -U postgres appximo_ci
          if ($LASTEXITCODE -ne 0) { throw "createdb failed" }

      - name: 'upgrade scenario 2: swap under a RUNNING serve (the released .exe boots)'
        working-directory: win-e2e
        run: |
          function Note($m) { $m | Tee-Object -Append -FilePath scenario.txt | Write-Host }
          $env:DATABASE_URL = 'postgres://postgres:root@localhost:5432/appximo_ci?sslmode=disable'
          $env:JWT_SECRET   = 'ci-windows-jwt-secret-0123456789abcdef'
          $env:ADMIN_KEY    = 'ci-windows-admin'
          $schema = Resolve-Path ..\examples\quickstart\schema.json
          # serve runs the RELEASE binary scenario 1 installed — this is also the
          # "released .exe actually boots on Windows" verification.
          Note "s2: starting serve"
          $proc = Start-Process -FilePath (Resolve-Path .\appximo.exe) `
            -ArgumentList 'serve','--schema',"$schema",'--port','8093' `
            -PassThru -NoNewWindow -RedirectStandardOutput serve.log -RedirectStandardError serve.err
          $ok = $false
          foreach ($i in 1..45) {
            try { Invoke-RestMethod http://localhost:8093/healthz | Out-Null; $ok = $true; break }
            catch { Start-Sleep 1 }
          }
          if (-not $ok) {
            Note "s2: serve never answered /healthz; serve.log/serve.err follow"
            Get-Content serve.log, serve.err -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath scenario.txt
            throw "the released .exe did not answer /healthz"
          }
          Note "s2: serve healthy (pid $($proc.Id)); upgrading under it"
          "SERVE_PID=$($proc.Id)" | Out-File -Append $env:GITHUB_ENV
          # The swap, while the same .exe is running AND is this process's own image.
          $out = .\appximo.exe upgrade --force --version $env:UPGRADE_TAG 2>&1 | Out-String
          Note "s2: upgrade exit=$LASTEXITCODE output:`n$out"
          if ($LASTEXITCODE -ne 0) { throw "upgrade under a running serve exited $LASTEXITCODE" }
          if (-not (Test-Path appximo.exe.old.exe)) { throw "no .old.exe after the running-serve swap" }
          # The old process must still be serving from its renamed image.
          Invoke-RestMethod http://localhost:8093/healthz | Out-Null
          Note "s2: PASS — old process still serving from the renamed image"

      - name: 'upgrade scenario 3: a LOCKED .old.exe fails loudly, binary intact'
        working-directory: win-e2e
        run: |
          function Note($m) { $m | Tee-Object -Append -FilePath scenario.txt | Write-Host }
          # serve (still running) now holds appximo.exe.old.exe as its image — the
          # natural aftermath of scenario 2 and exactly the backlog's locked case.
          $out = .\appximo.exe upgrade --force --version $env:UPGRADE_TAG 2>&1 | Out-String
          Note "s3: upgrade-with-locked-old exit=$LASTEXITCODE output:`n$out"
          if ($LASTEXITCODE -eq 0) { throw "upgrade must fail while .old.exe is locked; it exited 0" }
          if ($out -notmatch 'could not move the current binary aside') {
            throw "the failure must be the documented actionable one, got: $out"
          }
          # The machine is never left without a working engine.
          $v = .\appximo.exe version --json | ConvertFrom-Json
          if ($v.version -ne $env:UPGRADE_TAG) { throw "binary broken after failed upgrade: $($v.version)" }
          Note "s3: PASS — loud failure, binary intact"

      - name: Stop serve
        if: always()
        run: |
          if ($env:SERVE_PID) { Stop-Process -Id $env:SERVE_PID -Force -ErrorAction SilentlyContinue }

      - name: Upload Windows e2e logs (the black box for a failed scenario)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-logs
          path: |
            win-e2e/scenario.txt
            win-e2e/serve.log
            win-e2e/serve.err
          if-no-files-found: ignore

      - name: 'upgrade scenario 4: unwritable destination → actionable permission error'
        run: |
          New-Item -ItemType Directory -Force locked-dir | Out-Null
          Copy-Item win-e2e\appximo.exe locked-dir\appximo.exe
          icacls locked-dir /deny "${env:USERNAME}:(W,AD,WD)" | Out-Null
          try {
            $out = & .\locked-dir\appximo.exe upgrade --force --version $env:UPGRADE_TAG 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { throw "upgrade must fail in an unwritable directory; it exited 0" }
            if ($out -notmatch 'no permission to write' -or $out -notmatch 'Run as administrator') {
              throw "the permission error must name the path and the elevated command, got: $out"
            }
            # Nothing was broken and no second copy appeared.
            & .\locked-dir\appximo.exe version --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "binary broken after refused upgrade" }
          } finally {
            icacls locked-dir "/remove:d" "$env:USERNAME" | Out-Null
          }

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # OPS-3: the gate exists so `make lint` is enforced, not merely available.
      # Before this job, golangci-lint ran only when somebody remembered to, with
      # stock defaults, reporting 62 findings and exiting 1 — while the README
      # implied audited quality. The policy (and every exclusion's reason) lives in
      # .golangci.yml; this job is what makes it binding.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Matches the version developers run locally (make lint). golangci-lint
          # v2 removed --timeout (no default timeout anymore), so no args.
          version: v2.12.2

  govulncheck:
    name: vet + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  perf:
    name: k6 SLO gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appximo
          POSTGRES_PASSWORD: appximo
          POSTGRES_DB: appximo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appximo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appximo:appximo@localhost:5432/appximo?sslmode=disable
      JWT_SECRET: ci-perf-jwt-secret-0123456789abcdef
      ADMIN_KEY: ci-perf-admin-key
      # Prod-hardware target is 2000 RPS / p95<15ms (PRIMER). Shared CI runners are
      # not prod hardware, so drive a runner-safe rate while still enforcing the SLO
      # thresholds (p95<15ms, errors<1%) baked into the k6 script. See
      # tests/performance/README.md.
      RATE: "500"
      DURATION: 20s
      TENANT_ID: ciperf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build appximo
        run: go build -o appximo ./cmd/appximo

      - name: Install k6 + psql client
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz \
            | tar -xz
          sudo mv k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Provision tenant schema + seed
        run: |
          set -euo pipefail
          # The tenant pg schema is created by control-plane Register in prod;
          # ApplyTenantMigration (the `migrate` CLI) only does CREATE TABLE, so the
          # schema must exist first.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS tenant_'"$TENANT_ID"';'
          ./appximo migrate --tenant "$TENANT_ID" --schema tests/fixtures/schemas/logistics_schema.json
          # Seed 500 guides so the filtered query returns real rows.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO tenant_${TENANT_ID}.guides (code, status, origin, destination) \
             SELECT 'GU-'||g, (ARRAY['pending','in_transit','delivered','returned'])[1+(g%4)], 'BOG', 'MED' \
             FROM generate_series(1,500) g;"

      - name: Run k6 SLO gate
        run: |
          set -uo pipefail
          ./appximo serve --schema tests/fixtures/schemas/logistics_schema.json --port 8080 > serve.log 2>&1 &
          SERVER_PID=$!
          # Wait for liveness.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          TOKEN=$(./appximo token --tenant "$TENANT_ID" --role super_admin --secret "$JWT_SECRET")
          set +e
          BENCH_TOKEN="$TOKEN" k6 run \
            -e RATE="$RATE" -e DURATION="$DURATION" -e TENANT_ID="$TENANT_ID" \
            tests/performance/sustained_2krps.js
          RC=$?
          set -e
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then
            echo "::group::server log"; tail -n 100 serve.log; echo "::endgroup::"
          fi
          exit $RC
