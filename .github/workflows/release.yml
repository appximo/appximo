name: Release

# Publishes pre-built binaries to GitHub Releases — but ONLY for tags whose CI
# run (same SHA) finished green: like docker-publish.yml, this triggers on the
# completion of "CI" (workflow_run) instead of directly on the tag push, so a
# release of a red commit can never be published.
#
# To cut a release:
#   git tag v0.1.0 && git push --tags
# CI runs the full suite on the tag; when it passes, this workflow builds the
# binaries and attaches them (plus checksums.txt) to a GitHub Release for the
# tag. Nothing else to click.
#
# All targets are cross-compiled from one Linux runner: the binary is fully
# static (CGO_ENABLED=0 — wazero and modernc.org/sqlite are pure Go), so
# GOOS/GOARCH is all it takes; no per-arch runners or QEMU needed, and the
# checksums file covers every asset in one place.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write # create the release + upload assets
  id-token: write # cosign keyless signing (D2 — GitHub OIDC identity)

jobs:
  release:
    name: Build binaries & publish release
    runs-on: ubuntu-latest
    # Green CI + a push event + a v* tag. For tag runs, workflow_run.head_branch
    # carries the TAG name (e.g. "v0.1.0") — same convention docker-publish uses.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI validated — never the default branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The SPAs are go:embed-ded; their hashed assets are gitignored (committed
      # index.html only), so a bare checkout builds binaries that serve EMPTY
      # /editor and /admin shells (AGENTS.md documents the trap; the Dockerfile
      # already runs both npm builds — this is the release-path equivalent).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build embedded SPAs (Studio + admin)
        run: make editor-ui admin-ui

      - name: Build matrix (static cross-compile)
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # scripts/build-engine.sh is the ONE canonical engine build (same
          # flags as the Docker image and the deploy pipeline); the version
          # stamp makes `appximo version` on a downloaded binary report its tag.
          # windows/amd64 added in PHASE4-FIRST-MILE-S1: the Windows quick start
          # needs a downloadable .exe (the engine is CGO-free, so the cross-
          # compile is exactly the same as the others). NOT smoke-tested here
          # (no Windows runner in this job) — the quick start marks the Windows
          # path as community-verified.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" \
              ./scripts/build-engine.sh "dist/appximo-${VERSION}-${os}-${arch}${ext}" "$VERSION" "$REVISION"
          done
          ls -lh dist/

      - name: Smoke-test the native binary
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          OUT="$("dist/appximo-${VERSION}-linux-amd64" version)"
          echo "$OUT"
          echo "$OUT" | grep -F "$VERSION"

      - name: Version-less aliases (stable latest/download URLs — D1)
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # releases/latest/download/appximo-<os>-<arch>[.exe] must be a STABLE
          # URL (field report D1: with only versioned names, no one-line
          # installer can exist). Both names ship; checksums.txt covers both.
          for f in dist/appximo-"${VERSION}"-*; do
            base="${f##*/}"
            cp "$f" "dist/${base/appximo-${VERSION}-/appximo-}"
          done
          ls -lh dist/

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # D2 (field report): checksums.txt lives in the SAME release as the
      # binaries, so verifying against it only detects transport corruption —
      # whoever can replace the .exe can replace the checksums. The keyless
      # cosign signature moves the trust anchor OUT of the release: the
      # signing identity is this workflow's GitHub OIDC token, recorded in
      # Sigstore's public transparency log. Verify with:
      #   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      #     --certificate-identity-regexp 'github.com/appximo/appximo' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the checksums (keyless — the trust anchor lives outside the release)
        run: |
          set -euo pipefail
          cosign sign-blob --yes dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json

      # The one observed failure (v0.1.8, 2026-08-17, run 32055036588) died
      # INSIDE this API call in ~1 s — before any asset upload — leaving no
      # visible release and no retry. Two causes produce exactly that
      # signature: a pre-existing release already holding the tag (a DRAFT is
      # invisible to anonymous readers but still blocks `gh release create`),
      # or a transient API error. Both converge on the same fix: if a release
      # for the tag exists IN ANY STATE, upload into it and publish it;
      # otherwise create it, retrying once for the transient case. Re-running
      # this job is therefore always safe — it converges instead of failing.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          publish_into_existing() {
            echo "release $VERSION already exists — converging (upload assets + publish)"
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --draft=false --title "appximo $VERSION"
          }
          create_release() {
            gh release create "$VERSION" dist/* \
              --verify-tag \
              --title "appximo $VERSION" \
              --generate-notes
          }
          if gh release view "$VERSION" >/dev/null 2>&1; then
            publish_into_existing
          elif ! create_release; then
            echo "gh release create failed — retrying once in 30 s"
            sleep 30
            if gh release view "$VERSION" >/dev/null 2>&1; then
              publish_into_existing   # the first attempt half-landed
            else
              create_release
            fi
          fi
